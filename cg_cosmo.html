        }

            max-width: 1000px;

        }

            background: rgba(255, 255, 255, 0.08); 
            padding: 30px 25px; 
            border: 3px double #9370db; 
            border-radius: 15px; 
            margin-bottom: 30px; 
            box-shadow: 0 0 20px rgba(147, 112, 219, 0.3); 
        }
        .clan-section dt {
            font-size: 1.4em;
            color: #da70d6;
            margin-bottom: 10px;
        }
        .clan-section dd {
            font-size: 1.05em;
            color: #e0e0e0;
            line-height: 1.6;
            font-weight: normal;
        }

        .main img { 
            width: 80%; 
            max-width: 800px;
            border: 10px groove #4b0082; 
            margin: 20px 0; 
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .main img:hover {
            transform: scale(1.01);
        }

        /* ページ下部ナビゲーション */
        .page-bottom-nav {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(147, 112, 219, 0.3);
        }
        .page-bottom-nav a {
            color: #da70d6;
            text-decoration: none;

        }
        .page-bottom-nav a:hover {

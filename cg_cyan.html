    <style>
        body {
            padding: 30px;
            color: #FFFFFF;
            background-color: #008080;
            font-weight: bold;
            font-size: 120%;
            font-family: serif;
            min-height: 100vh;
        }

        /* 共通ヘッダーのスタイル */
        header {
            background: rgba(173, 216, 230, 0.2);
            backdrop-filter: blur(5px);
            height: 100px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
        }
        header img {
            height: 100%;
            width: auto;
        }
        .header_container {
            display: flex;
            width: 100%;
            justify-content: flex-end;
            align-items: center;
        }
        .header_item {
            margin: 0 10px;
        }
        .header_item a {
            color: #ffffff;
            text-decoration: none;
        }
        .header_item a:hover {
            color: #00ffff;
        }

        /* ギャラリー構造 */
        .gallery-container {
            border: 8px groove gold;
            padding: 25px;
            background-color: rgba(0, 64, 64, 0.6);
            border-radius: 12px;
            margin-top: 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .gallery-title {
            border-bottom: 5px double #00ffff;
            padding-bottom: 10px;
            text-align: center;
            color: #00ffff;
            margin-bottom: 15px;
        }
        .cg-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #00ffff;
            padding: 20px;
            margin-top: 25px;
            margin-bottom: 30px;
            text-align: center;
            border-radius: 8px;
        }
        .cg-card h3 {
            color: #00ffff;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .cg-card img {
            max-width: 80%;
            height: auto;
            border: 5px groove gold;
            margin: 15px 0;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .cg-card img:hover {
            transform: scale(1.01);
        }
        .cg-description {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            border-left: 4px solid #00ffff;
            font-size: 0.9em;
            line-height: 1.6;
            margin-top: 15px;
            border-radius: 0 4px 4px 0;
        }

        /* ページ下部ナビゲーション */
        .page-bottom-nav {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 255, 0.3);
        }
        .page-bottom-nav a {
            color: gold;
            text-decoration: none;
            margin: 0 15px;
        }
        .page-bottom-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <h2 id="top1" class="gallery-title">■ 五色連合：水色 アーカイブ</h2>
        <p class="text-center" style="color: #e0e0e0;">水色に属する者たちのCG・記録ギャラリーです。</p>

        <!-- CG項目 1 -->
        <div class="cg-card">
            <h3>水瀬れい - 戦闘形態</h3>
            <img src="五色連合基地内で戦闘服姿の水瀬れい.jpg" alt="五色連合基地内での戦闘服姿の水瀬れい">
            <div class="cg-description">
                <p style="margin-bottom: 5px; font-weight: bold; color: #00ffff;">【解説】</p>
                <p style="margin-bottom: 0; font-weight: normal;">黒ベースの戦闘服にシアンの発光ラインが走る特殊装備。サイバー空間および実空間での戦闘に対応。高出力の魔力回路を同調させることで発光ラインの光量が増大する。</p>
            </div>
        </div>

<!doctype html>
<html lang="ja">
<head>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <style>
        body {
            padding: 30px;
            color: #FFFFFF;
            background-color: #ff8c00; /* ハピアラ・オレンジを識別色に設定 */
            font-weight: bold;
            font-family: serif;
            min-height: 100vh;
        }

        /* 共通ヘッダーのスタイル */
        header {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            height: 100px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 30px;
        }
        header img {
            height: 100%;
            width: auto;
        }
        .header_container {
            display: flex;
            width: 100%;
            justify-content: flex-end;
            align-items: center;
        }
        .header_item {
            margin: 0 10px;
        }
        .header_item a {
            color: #ffffff;
            text-decoration: none;
        }
        .header_item a:hover {
            color: gold;
        }

        /* メインコンテンツ */
        .main {
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .unit-section {
            background: rgba(0, 0, 0, 0.25);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }
        .unit-section dt {
            font-size: 1.3em;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .unit-section dd {
            font-size: 1em;
            color: #f0f0f0;
            margin-bottom: 15px;
            font-weight: normal;
        }

        .main img {
            width: 75%;
            max-width: 800px;
            border: 10px groove gold;
            margin: 15px 0;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .main img:hover {
            transform: scale(1.01);
        }

        /* ページ下部ナビゲーション */
        .page-bottom-nav {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        .page-bottom-nav a {
            color: gold;
            text-decoration: none;
            margin: 0 15px;
        }
        .page-bottom-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 共通ヘッダーナビゲーション -->
    <header>
        <img src="stripes.png" alt="ヘッダー装飾画像">
        <nav class="header_container">

            <div class="header_item"><a href="創作物の宝物庫-CGエリア.html">🎨 CGエリア</a></div>
            <div class="header_item"><a href="創作物の宝物庫-MUSICエリア.html">MUSIC</a></div>
            <div class="header_item"><a href="創作物の宝物庫-小説エリア.html">小説</a></div>
        </nav>
    </header>

    <div class="main">
        <h1 id="top2" style="margin-bottom: 30px;">🎧 D4DJ アーカイブ</h1>

        <h2 style="text-align: left; margin-left: 5%;">■ Happy Around! (ハピアラ)</h2>
        <div class="unit-section">
            <dt>大鳴門むに in 喫茶バイナル</dt>
            <dd>麗ちゃんに有栖川学院の制服を着せられて……</dd>
            <img src="大鳴門むにin喫茶バイナル.png" alt="大鳴門むに">
        </div>

        <h2 style="text-align: left; margin-left: 5%;">■ コラボレーション</h2>
        <div class="unit-section" style="border-left: 10px solid gold;">
            <dt>真秀 & ルミナ（共演）</dt>
            <dd>ハピアラとユニチャ、二人の特別な時間。</dd>
            <img src="寄道一星ルミナと私服明石真秀.png" alt="真秀＆ルミナ共演">
        </div>
    </div>

    <!-- ページ下部ナビゲーション -->
    <div class="page-bottom-nav">

        </p>
    </div>

</body>
</html>

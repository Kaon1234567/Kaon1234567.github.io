        header {

        .header_item {
            margin: 0 10px;

        .header_item a {

        }

        }

        .main {
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
        }

            background: rgba(255, 0, 0, 0.05); 
            padding: 30px 25px; 
            border: 3px solid #ff0000; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }
        .work-section h3 {
            color: #ff4d4d;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .work-section dt {
            font-size: 1.3em;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .work-section dd {
            font-size: 1em;
            color: #dddddd;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .main img { 
            width: 70%; 
            max-width: 800px;
            border: 10px groove #444444; /* 盾のような重厚な枠 */
            margin: 15px 0; 
            outline: 2px solid #ff0000;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .main img:hover {
            transform: scale(1.01);
        }

        /* ページ下部ナビゲーション */
        .page-bottom-nav {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 0, 0, 0.3);
        }
        .page-bottom-nav a {
            color: #ff4d4d;
            text-decoration: none;
            margin: 0 15px;
        }
        .page-bottom-nav a:hover {

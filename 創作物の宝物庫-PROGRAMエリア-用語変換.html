<!DOCTYPE html>
<html lang="ja">
<head>

        .title { font-size: 3rem; margin: 10px 0; text-shadow: 0 0 20px #b8860b; letter-spacing: 0.5rem; }

            height: 2.2rem; 
            margin: 5px 0; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px #000;
        }

        #hint-display {
            font-size: 1rem;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            border: 1px dashed #00ffff;
            border-radius: 5px;
            padding: 8px 15px;
            margin: 5px auto;
            width: 90%;
            max-width: 500px;
            box-sizing: border-box;
            min-height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;

            margin-top: 10px;
            position: relative;
            z-index: 10;
        }

            border: 2px solid #ffd700; 
            color: #fff; 
            padding: 12px; 
            font-size: 1.2rem;

            max-width: 300px;
            text-align: center; 
            border-radius: 5px; 
            box-sizing: border-box;

            margin-bottom: 15px;
            border: 1px solid #ffd700;
        }

            margin: 5px; 
            color: #000; 
            border-radius: 5px;

</head>

    let hintIndex = 0;
    let startTime = 0;
    let playerName = "";

    let stats = {
        misCount: 0,
        giveUps: 0,
        correctCount: 0,
        history: []
    };

    function playSE(id) {
        const se = document.getElementById(id);
        if (se) {
            se.currentTime = 0;
            se.play().catch(() => {});
        }
    }

    // ゲーム開始処理
    function startGame() {
        const nameInput = document.getElementById("user-name");
        playerName = nameInput.value.trim() || "名無し";

        currentQuestions = [...masterData].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        hintCount = 0;
        startTime = Date.now();

        stats = {
            misCount: 0,
            giveUps: 0,
            correctCount: 0,
            history: []
        };

        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");

        const bgm = document.getElementById("bgm");
        bgm.currentTime = 0;
        bgm.play().catch(() => {});

        document.getElementById("answer-input").addEventListener("keypress", handleKeyPress);

        showQuestion();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    }

    // 問題表示
    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('character-img').src = "3分10秒_HR&D_真剣.png";
        document.getElementById('feedback').innerText = "";
        document.getElementById('hint-display').innerText = "ヒントはここに表示されます";
        document.getElementById('answer-input').value = "";
        document.getElementById('answer-input').focus();
        stats.misCount = 0;
        hintIndex = 0;
    }

    // 回答チェック
    function checkAnswer() {
        const input = document.getElementById('answer-input').value.trim();
        if (!input) return;

        const q = currentQuestions[currentIndex];

        if (input === q.a) {
            playSE('se-correct');
            
            const imgName = "3分10秒_HR&D_照れ.png";
            document.getElementById('character-img').src = imgName;
            document.getElementById('feedback').innerHTML = `<span style="color:#0f0">〇 正解!</span> ${q.en}`;
            
            stats.correctCount++;
            stats.history.push({
                questionIndex: currentIndex,
                result: 'correct',
                imageUsed: imgName,
                misses: stats.misCount
            });

            setTimeout(next, 1500);
        } else {
            playSE('se-wrong');
            stats.misCount++;
            
            const imgName = "3分10秒_HR&D_切ない.png";
            document.getElementById('character-img').src = imgName;
            document.getElementById('feedback').innerHTML = `<span style="color:#f00">× 不正解</span>`;
            
            if (stats.misCount >= 7) {
                stats.giveUps++;
                document.getElementById('feedback').innerHTML = `<span style="color:#ffd700">正解: ${q.a}</span>`;
                
                stats.history.push({
                    questionIndex: currentIndex,
                    result: 'giveup',
                    imageUsed: imgName,
                    misses: stats.misCount
                });

                setTimeout(next, 2000);
            } else {
                const inputEl = document.getElementById('answer-input');
                inputEl.value = "";
                inputEl.focus();
            }
        }
    }

    function next() {
        currentIndex++;
        if (currentIndex < 5) {
            showQuestion();
        } else {
            showResult();
        }
    }

    // ヒント表示
    function showHint() {
        const q = currentQuestions[currentIndex];
        const hintEl = document.getElementById('hint-display');
        
        if (!q.hints || q.hints.length === 0) {
            hintEl.innerText = "この問題にはヒントがありません。";
            document.getElementById('answer-input').focus();
            return;
        }

        if (hintIndex < q.hints.length) {
            hintEl.innerText = `【ヒント ${hintIndex + 1}】 ${q.hints[hintIndex]}`;
            hintIndex++;
            hintCount++;
        } else {
            hintEl.innerText = "これ以上のヒントはありません！";
        }
        document.getElementById('answer-input').focus();
    }

    // 図鑑表示/非表示
    function toggleZukan(show) {
        const overlay = document.getElementById("zukan-overlay");
        if (show) {
            const zukanContent = document.getElementById("zukan-content");
            zukanContent.innerHTML = masterData.map((item, i) => `
                <div class="zukan-item">
                    <strong style="color:#ffd700;">[${i + 1}] ${item.a}</strong> (${item.en})<br>
                    <span style="color:#ddd; font-size: 0.95rem;">元問題: ${item.q}</span>
                </div>
            `).join('');
            overlay.style.display = "flex";
        } else {
            overlay.style.display = "none";
            document.getElementById('answer-input').focus();
        }
    }

    // ゲーム終了（リザルト・称号表示）
    function showResult() {
        document.getElementById("answer-input").removeEventListener("keypress", handleKeyPress);
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");

        const endTime = Date.now();
        const elapsedTimeSec = Math.floor((endTime - startTime) / 1000);

        let rank = "C";
        let titleName = "見習い用語変換士";

        if (stats.correctCount >= 5 && hintCount === 0) {
            rank = "S+";
            titleName = "神域の用語演算者";
        } else if (stats.correctCount >= 5) {
            rank = "S";
            titleName = "用語変換マスター";
        } else if (stats.correctCount >= 4) {
            rank = "A";
            titleName = "優秀な変換士";
        } else if (stats.correctCount >= 3) {
            rank = "B";
            titleName = "一人前の解読者";
        }

        document.getElementById("rank-display").innerText = `RANK : ${rank}`;
        document.getElementById("title-display").innerText = `称号: 「${titleName}」`;
        document.getElementById("final-stats").innerHTML = `
            プレイヤー: ${playerName}<br>
            正解数: ${stats.correctCount} / 5<br>
            ギブアップ数: ${stats.giveUps}<br>
            使用ヒント数: ${hintCount}<br>
            経過時間: ${elapsedTimeSec}秒
        `;

        saveAndRenderRanking({
            name: playerName,
            score: stats.correctCount,
            title: titleName,
            hints: hintCount,
            time: elapsedTimeSec,
            date: new Date().toLocaleDateString('ja-JP')
        });
    }

    // ランキング保存・表示
    function saveAndRenderRanking(newRecord) {
        let rankings = JSON.parse(localStorage.getItem("terms_conversion_rankings") || "[]");
        rankings.push(newRecord);

        rankings.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            if (a.hints !== b.hints) return a.hints - b.hints;
            return a.time - b.time;
        });

        rankings = rankings.slice(0, 5);
        localStorage.setItem("terms_conversion_rankings", JSON.stringify(rankings));

        const tbody = document.getElementById("ranking-body");
        tbody.innerHTML = `
            <tr>
                <th>順位</th>
                <th>名前</th>
                <th>称号 / スコア</th>
                <th>ヒント</th>
                <th>時間</th>
            </tr>
        ` + rankings.map((r, index) => `
            <tr>
                <td>${index + 1}</td>
                <td>${r.name}</td>
                <td>${r.title || "用語変換士"}<br>(${r.score}問)</td>
                <td>${r.hints}回</td>
                <td>${r.time}秒</td>
            </tr>
        `).join('');
    }
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CGエリア - 緑の一族アーカイブ</title>
    <meta name="description" content="創作物の宝物庫-CGエリア-緑の一族アーカイブ">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <style>
        body {
            padding: 30px;
            color: #FFFFFF;
            background-color: #004d00; /* 緑の一族の識別色：深緑 */
            font-weight: bold;
            font-family: serif;
            min-height: 100vh;
        }

        /* 共通ヘッダーのスタイル */
        header {
            background: rgba(0, 255, 0, 0.1);
            backdrop-filter: blur(5px);
            height: 100px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            padding: 5px 15px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            margin-bottom: 30px;
        }
        header img {
            height: 100%;
            width: auto;
        }
        .header_container {
            display: flex;
            width: 100%;
            justify-content: flex-end;
            align-items: center;
        }
        .header_item {
            margin: 0 10px;
        }
        .header_item a {
            color: #ffffff;
            text-decoration: none;
        }
        .header_item a:hover {
            color: #00ff00;
        }

        /* メインコンテンツ */
        .main {
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .clan-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px 25px;
            border: 2px solid #00ff00;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        .clan-section dt {
            font-size: 1.4em;
            color: #00ff00;
            margin-bottom: 10px;
        }
        .clan-section dd {
            font-size: 1em;
            color: #e0e0e0;
            margin-bottom: 20px;
            font-weight: normal;
        }

        .main img {
            width: 75%;
            max-width: 800px;
            border: 10px groove #00ff00;
            margin: 15px 0;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }
        .main img:hover {
            transform: scale(1.01);
        }

        /* ページ下部ナビゲーション */
        .page-bottom-nav {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 0, 0.3);
        }
        .page-bottom-nav a {
            color: #00ff00;
            text-decoration: none;
            margin: 0 15px;
        }
        .page-bottom-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 共通ヘッダーナビゲーション -->
    <header>
        <img src="stripes.png" alt="ヘッダー装飾画像">
        <nav class="header_container">
            <div class="header_item"><a href="index.html">🚪 玄関(index)</a></div>
            <div class="header_item"><a href="創作物の宝物庫.html">🏛️ 宝物庫(ポータル)</a></div>
            <div class="header_item"><a href="創作物の宝物庫-PROGRAMエリア.html">PROGRAM</a></div>
            <div class="header_item"><a href="創作物の宝物庫-CGエリア.html">🎨 CGエリア</a></div>
            <div class="header_item"><a href="創作物の宝物庫-MUSICエリア.html">MUSIC</a></div>
            <div class="header_item"><a href="創作物の宝物庫-小説エリア.html">小説</a></div>
        </nav>
    </header>

    <div class="main">
        <h1 id="top2" style="border-bottom: 3px solid #00ff00; display: inline-block; padding-bottom: 5px; margin-bottom: 30px;">緑の一族：研究記録庫</h1>

        <div class="clan-section">
            <dt>元研究者 小翠 智永子</dt>
            <dd>大学に所属していた過去を持つ緑の一族の女性。大樹の丘で休息をとる一幕。</dd>
            <img src="元研究者小翠智永子.png" alt="小翠智永子">
        </div>
    </div>

    <!-- ページ下部ナビゲーション -->
    <div class="page-bottom-nav">
        <h3><a href="#top2">▲ このページのTOPへ戻る</a></h3>
        <p style="margin-top: 15px;">
            <a href="創作物の宝物庫-CGエリア.html">← CGポータルへ戻る</a>
        </p>
    </div>

</body>
</html>
